<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giỏ hàng | Sportify Premium Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Tích hợp SweetAlert2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --white: #ffffff;
      --gray-bg: #f9fafb;
      --gray-border: #e5e7eb;
      --black: #000000;
      --text-muted: #6b7280;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --radius-sm: 2px;
      /* Bo góc cực nhẹ, sắc nét */
      --radius-md: 4px;
      --transition: all 0.2s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--white);
      color: var(--black);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== HEADER ĐỒNG BỘ ===== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--white);
      border-bottom: 1px solid var(--black);
      /* Đường viền đen phẳng mảnh cực chất */
      padding: 20px 0;
    }

    .topbar-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-wrapper {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0px;
      color: var(--black);
      margin-left: 12px;
      text-transform: uppercase;
    }

    .back-link {
      text-decoration: none;
      color: var(--black);
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
    }

    .back-link:hover {
      border-color: var(--black);
    }

    /* ===== LAYOUT TRANG GIỎ HÀNG ===== */
    .cart-page {
      max-width: 1440px;
      margin: 60px auto 100px;
      padding: 0 40px;
      display: grid;
      grid-template-columns: 1fr 450px;
      gap: 60px;
    }

    .cart-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 40px;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    .cart-header {
      display: grid;
      grid-template-columns: 3.5fr 1.2fr 1.5fr 1.2fr 50px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--black);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--black);
    }

    /* ĐỊNH DẠNG SẢN PHẨM TRONG GIỎ */
    .cart-item {
      display: grid;
      grid-template-columns: 3.5fr 1.2fr 1.5fr 1.2fr 50px;
      align-items: center;
      padding: 24px 0;
      border-bottom: 1px solid var(--gray-border);
      transition: var(--transition);
    }

    .product-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .product-img {
      width: 80px;
      height: 106px;
      background: var(--gray-bg);
      border-radius: var(--radius-sm);
      object-fit: cover;
      object-position: center;
      border: 1px solid var(--gray-border);
    }

    .product-details .name {
      font-weight: 700;
      font-size: 15px;
      color: var(--black);
      margin-bottom: 6px;
      text-transform: uppercase;
      /* Đồng bộ thể thao mạnh mẽ */
      letter-spacing: 0.3px;
    }

    .product-details .variant-info {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      background: var(--gray-bg);
      display: inline-block;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid var(--gray-border);
    }

    .price,
    .subtotal {
      font-weight: 600;
      font-size: 15px;
    }

    .subtotal {
      font-weight: 700;
    }

    /* BỘ TĂNG GIẢM SỐ LƯỢNG vuông vắn */
    .quantity-control {
      display: flex;
      align-items: center;
      border: 1px solid var(--black);
      /* Đổi sang viền đen cứng cáp */
      width: fit-content;
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .qty-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: var(--white);
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      color: var(--black);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-btn:hover {
      background: var(--black);
      color: var(--white);
    }

.qty-input {
      width: 36px;
      height: 32px;
      border: none;
      border-left: 1px solid var(--black);
      border-right: 1px solid var(--black);   
      background: transparent;
      text-align: center;
      font-weight: 700;
      font-size: 13px;
      outline: none;
      color: var(--black);
    }
    .qty-input::-webkit-outer-spin-button,
    .qty-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* NÚT XÓA SẢN PHẨM tối giản phẳng */
    .remove-btn {
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 14px;
      transition: var(--transition);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 36px;
      width: 36px;
      border-radius: var(--radius-sm);
    }

    .remove-btn:hover {
      color: var(--black);
      background: var(--gray-bg);
    }

    /* ===== KHỐI TỔNG ĐƠN HÀNG & THÔNG TIN ĐẶT HÀNG ===== */
    .cart-summary {
      background: var(--white);
      /* Chuyển nền trắng phẳng */
      padding: 0 0 40px 0;
      border-radius: 0;
      height: fit-content;
      position: sticky;
      top: 120px;
      border: none;
      border-left: 1px solid var(--gray-border);
      /* Sử dụng border cắt dọc tinh tế */
      padding-left: 40px;
    }

    .summary-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid var(--black);
      padding-bottom: 10px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 18px;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .summary-row span:last-child {
      color: var(--black);
      font-weight: 700;
    }

    .summary-row.total {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid var(--black);
      font-size: 22px;
      font-weight: 900;
    }

    /* FORM NHẬP THÔNG TIN GIAO HÀNG vuông vắn */
    .checkout-form-section {
      margin-top: 40px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--gray-border);
      background: var(--white);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      outline: none;
      transition: var(--transition);
    }

    .form-control:focus {
      border-color: var(--black);
    }

    /* PHƯƠNG THỨC THANH TOÁN phẳng */
    .payment-methods {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .payment-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--gray-border);
      background: var(--white);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
    }

    .payment-option:hover {
      border-color: var(--black);
    }

    .payment-option input[type="radio"] {
      accent-color: var(--black);
      width: 16px;
      height: 16px;
    }

    .payment-option label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Nút Thanh toán Đen nguyên khối vuông góc hoàn toàn */
    .checkout-btn {
      width: 100%;
      padding: 18px;
      border: none;
      background: var(--black);
      color: var(--white);
      font-weight: 800;
      cursor: pointer;
      margin-top: 25px;
      border-radius: 0px;
      /* Vuông góc tuyệt đối khỏe khoắn */
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 1.5px;
      transition: var(--transition);
    }

    .checkout-btn:hover {
      background: #222222;
      opacity: 0.9;
    }

    .checkout-btn:disabled {
      background: #e5e7eb;
      color: #9ca3af;
      cursor: not-allowed;
    }

    /* Tối ưu hóa SweetAlert2 sang Phong cách Modern Brutalism (Đen/Trắng) */
    .swal2-popup {
      border-radius: 0px !important;
      /* Không bo góc thông báo alert */
      /* border: 2px solid var(--black) !important; */
    }

    .swal2-title {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-weight: 800 !important;
      text-transform: uppercase !important;
      font-size: 18px !important;
      letter-spacing: 0.5px;
    }

    .swal2-html-container {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-weight: 500 !important;
      font-size: 14px !important;
    }

    .swal2-confirm {
      background-color: var(--black) !important;
      border-radius: 0px !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      font-size: 12px !important;
      letter-spacing: 1px !important;
    }

    .swal2-cancel {
      border-radius: 0px !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      font-size: 12px !important;
      letter-spacing: 1px !important;
      background-color: #f3f4f6 !important;
      color: #000000 !important;
      /* border: 1px solid #000000 !important; */
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1024px) {
      .cart-page {
        grid-template-columns: 1fr;
        gap: 50px;
        padding: 0 20px;
        margin-top: 30px;
      }

      .cart-summary {
        border-left: none;
        padding-left: 0;
        border-top: 1px solid var(--gray-border);
        padding-top: 40px;
      }

      .topbar-inner {
        padding: 0 20px;
      }

      .cart-header {
        display: none;
      }

      .cart-item {
        grid-template-columns: 1fr;
        gap: 16px;
        text-align: center;
        justify-items: center;
        padding: 30px 15px;
        background: var(--gray-bg);
        border-radius: var(--radius-sm);
        margin-bottom: 15px;
        border: 1px solid var(--gray-border);
        position: relative;
      }

      .product-info {
        flex-direction: column;
        gap: 12px;
      }

      .remove-btn {
        position: absolute;
        top: 15px;
        right: 15px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="products.html" class="brand-wrapper">
        <div class="brand-title">SPORTIFY</div>
      </a>
      <a href="products.html" class="back-link">
        <i class="fa-solid fa-arrow-left-long"></i> Tiếp tục mua sắm
      </a>
    </div>
  </header>

  <main class="cart-page">
    <section style="position: relative;">
      <h2 class="cart-title">Giỏ hàng của bạn</h2>

      <div class="cart-header">
        <span>Sản phẩm</span>
        <span>Đơn giá</span>
        <span>Số lượng</span>
        <span>Thành tiền</span>
        <span></span>
      </div>

      <div id="cart-items-container">
        <p style="padding: 60px; text-align: center; color: var(--text-muted); font-weight: 500;">
          <i class="fa-solid fa-spinner fa-spin" style="margin-right: 8px;"></i> Đang cập nhật túi đồ của bạn...
        </p>
      </div>
    </section>

    <aside class="cart-summary">
      <h3 class="summary-title">Tổng kết đơn hàng</h3>
      <div class="summary-row">
        <span>Tạm tính</span>
        <span id="subtotal-amount">0đ</span>
      </div>
      <div class="summary-row">
        <span>Vận chuyển</span>
        <span style="color: #10b981; font-weight: 700;">MIỄN PHÍ</span>
      </div>
      <div class="summary-row total">
        <span>TỔNG CỘNG</span>
        <span id="total-amount">0đ</span>
      </div>

      <div class="checkout-form-section" id="checkout-form-container" style="display: none;">
        <h4 class="summary-title"
          style="font-size: 13px; margin-bottom: 20px; border-bottom: 1px solid var(--gray-border); padding-bottom: 6px;">
          Thông tin nhận hàng</h4>

        <div class="form-group">
          <label for="order-receiver">Họ tên người nhận</label>
          <input type="text" id="order-receiver" class="form-control" placeholder="Nhập họ tên người nhận">
        </div>

        <div class="form-group">
          <label for="order-phone">Số điện thoại</label>
          <input type="tel" id="order-phone" class="form-control" placeholder="Nhập số điện thoại nhận hàng">
        </div>

        <div class="form-group">
          <label for="order-address">Địa chỉ giao hàng</label>
          <input type="text" id="order-address" class="form-control" placeholder="Số nhà, tên đường, quận/huyện, tỉnh">
        </div>

        <div class="form-group">
          <label>Phương thức thanh toán</label>
          <div class="payment-methods">
            <div class="payment-option">
              <input type="radio" id="method-cod" name="paymentMethod" value="COD" checked>
              <label for="method-cod"><i class="fa-solid fa-truck-ramp-box"></i> Thanh toán COD (Tiền mặt)</label>
            </div>
            <div class="payment-option">
              <input type="radio" id="method-vnpay" name="paymentMethod" value="VNPAY">
              <label for="method-vnpay"><i class="fa-solid fa-credit-card"></i> Thẻ ATM / QR Code (VNPAY)</label>
            </div>
          </div>
        </div>
      </div>

      <button class="checkout-btn" id="main-action-btn" onclick="processCheckout()">Xác nhận thông tin đặt hàng</button>
    </aside>
  </main>

  <script src="api.js"></script>
  <script>
    const IMAGE_BASE_URL = "https://res.cloudinary.com/l3chl8tz/image/upload/products/";
    const IMAGE_BASE_URL_FALLBACK = "https://res.cloudinary.com/l3chl8tz/image/upload/";
    let hasItemsInCart = false;
    let isFormVisible = false;

    document.addEventListener('DOMContentLoaded', loadCart);

    function isUserLoggedIn() {
      return Boolean(localStorage.getItem('fullName') || localStorage.getItem('email') || accessToken);
    }

    async function loadCart() {
      const container = document.getElementById('cart-items-container');
      try {
        const response = await apiGet('/cart');
        const cartItems = (response && response.items) ? response.items : [];

        if (cartItems.length === 0) {
          hasItemsInCart = false;
          container.innerHTML = `
            <div style="text-align: center; padding: 80px 0;">
              <i class="fa-solid fa-bag-shopping" style="font-size: 40px; color: #000000; margin-bottom: 20px;"></i>
              <p style="color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; margin-bottom: 25px;">Túi đồ của bạn đang trống.</p>
              <a href="products.html" class="checkout-btn" style="display: inline-block; width: auto; padding: 14px 35px; text-decoration: none;">MUA SẮM NGAY</a>
            </div>`;
          updateSummary(0);
          document.getElementById('checkout-form-container').style.display = 'none';
          document.getElementById('main-action-btn').style.display = 'none';
          return;
        }
        hasItemsInCart = true;
        document.getElementById('main-action-btn').style.display = 'block';
        renderCart(cartItems);
      } catch (err) {
        const isGuest = !isUserLoggedIn();
        container.innerHTML = `
          <div style="text-align: center; padding: 50px 20px; color: var(--black); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">
            <i class="fa-solid fa-right-to-bracket" style="font-size: 28px; margin-bottom: 16px; display: block;"></i>
            <p style="margin: 0 0 16px; font-size: 13px;">${isGuest ? 'Vui lòng đăng nhập để xem và quản lý giỏ hàng.' : 'Không thể tải giỏ hàng lúc này.'}</p>
            ${isGuest ? `<a href="login.html?redirect=${encodeURIComponent(window.location.href)}" class="checkout-btn" style="display: inline-block; width: auto; padding: 12px 24px; text-decoration: none;">ĐĂNG NHẬP NGAY</a>` : ''}
          </div>`;
        document.getElementById('checkout-form-container').style.display = 'none';
        document.getElementById('main-action-btn').style.display = 'none';
      }
    }

    function renderCart(items) {
      const container = document.getElementById('cart-items-container');
      let total = 0;

      const html = items.map(item => {
        const price = item.price || 0;
        const qty = item.quantity || 0;
        const itemTotal = price * qty;
        total += itemTotal;

        const imgUrl = item.image ? (item.image.startsWith('http') ? item.image : `${IMAGE_BASE_URL}${item.image}`) : 'https://via.placeholder.com/200';
        const imgFallback = item.image && !item.image.startsWith('http') ? `${IMAGE_BASE_URL_FALLBACK}${item.image}` : '';

        return `
          <div class="cart-item" id="cart-item-${item.productColorSizeId}">
            <div class="product-info">
              <img src="${imgUrl}" alt="${item.productName}" class="product-img" ${imgFallback ? `onerror="this.onerror=null; this.src='${imgFallback}'"` : ''}>
              <div class="product-details">
                <div class="name">${item.productName}</div>
                <div class="variant-info">
                  Màu: ${item.colorName || 'N/A'} | Size: ${item.sizeName || 'N/A'}
                </div>
              </div>
            </div>
            <div class="price">${price.toLocaleString('vi-VN')}đ</div>
            <div class="quantity-control">
                <button class="qty-btn" onclick="changeQty(${item.productColorSizeId}, ${item.quantity - 1})"><i class="fa-solid fa-minus"></i></button>
                <input 
                  type="number" 
                  value="${item.quantity}" 
                  class="qty-input" 
                  min="1"
                  inputmode="numeric"
                  onchange="handleQtyInputChange(this, ${item.productColorSizeId})"
                  onkeydown="if(event.key === 'Enter') this.blur()"
                >
                <button class="qty-btn" onclick="changeQty(${item.productColorSizeId}, ${item.quantity + 1})"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div class="subtotal">${itemTotal.toLocaleString('vi-VN')}đ</div>
            <button class="remove-btn" onclick="deleteItem(${item.productColorSizeId})">
              <i class="fa-regular fa-trash-can"></i>
            </button>
          </div>
        `;
      }).join('');

      container.innerHTML = html;
      updateSummary(total);
    }
    async function handleQtyInputChange(inputElement, vId) {
      let newQty = parseInt(inputElement.value);

      // Nếu nhập chữ, để trống, hoặc nhập số < 1 thì mặc định về 1
      if (isNaN(newQty) || newQty < 1) {
        newQty = 1;
      }

      inputElement.value = newQty;

      // Gọi hàm cập nhật số lượng qua API
      await changeQty(vId, newQty);
    }

    async function changeQty(vId, newQty) {
      if (newQty < 1) return;
      try {
        await apiPut('/cart/update', { productColorSizeId: vId, quantity: newQty });
        loadCart();
      } catch (err) {
        Swal.fire({
          title: 'CẬP NHẬT THẤT BẠI',
          text: err.message || 'Không thể cập nhật số lượng sản phẩm.',
          icon: 'error',
          showConfirmButton: false,
          timer: 1500,
          timerProgressBar: true
        });
        loadCart(); // Khôi phục lại số lượng cũ trên UI nếu gặp lỗi
      }
    }

    async function deleteItem(vId) {
      const result = await Swal.fire({
        title: 'XÓA SẢN PHẨM?',
        text: "Bạn có chắc chắn muốn xóa sản phẩm này khỏi túi đồ không?",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#000000',
        cancelButtonColor: '#ffffff',
        confirmButtonText: 'ĐỒNG Ý XÓA',
        cancelButtonText: 'QUAY LẠI'
      });

      if (!result.isConfirmed) return;

      try {
        await apiDelete(`/cart/remove/${vId}`);

        const itemElement = document.getElementById(`cart-item-${vId}`);
        if (itemElement) {
          itemElement.remove();
        }

        const container = document.getElementById('cart-items-container');
        const remainingItems = container.querySelectorAll('.cart-item');

        if (remainingItems.length === 0) {
          hasItemsInCart = false;
          container.innerHTML = `
            <div style="text-align: center; padding: 80px 0;">
              <i class="fa-solid fa-bag-shopping" style="font-size: 40px; color: #000000; margin-bottom: 20px;"></i>
              <p style="color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; margin-bottom: 25px;">Túi đồ của bạn đang trống.</p>
              <a href="products.html" class="checkout-btn" style="display: inline-block; width: auto; padding: 14px 35px; text-decoration: none;">MUA SẮM NGAY</a>
            </div>`;
          updateSummary(0);
          document.getElementById('checkout-form-container').style.display = 'none';
          document.getElementById('main-action-btn').style.display = 'none';
        } else {
          recalculateTotal();
        }

        Swal.fire({
          title: 'ĐÃ XÓA SẢN PHẨM',
          text: 'Sản phẩm đã được loại khỏi túi đồ của bạn.',
          icon: 'success',
          showConfirmButton: false,
          timer: 1000,
          timerProgressBar: true
        });

      } catch (err) {
        console.error(err);
        Swal.fire({
          title: 'LỖI HỆ THỐNG',
          text: 'Không thể xóa sản phẩm vào lúc này.',
          icon: 'error',
          showConfirmButton: false,
          timer: 1500,
          timerProgressBar: true
        });
      }
    }

    function recalculateTotal() {
      let total = 0;
      const subtotalElements = document.querySelectorAll('.cart-item .subtotal');

      subtotalElements.forEach(el => {
        const value = parseInt(el.textContent.replace(/[^\d]/g, '')) || 0;
        total += value;
      });

      updateSummary(total);
    }

    function updateSummary(total) {
      const formattedTotal = total.toLocaleString('vi-VN') + 'đ';
      document.getElementById('subtotal-amount').innerText = formattedTotal;
      document.getElementById('total-amount').innerText = formattedTotal;
    }

    function requireLoginForCheckout() {
      const loggedIn = Boolean(localStorage.getItem('fullName') || localStorage.getItem('email') || accessToken);
      if (!loggedIn) {
        Swal.fire({
          title: 'YÊU CẦU ĐĂNG NHẬP',
          text: 'Vui lòng đăng nhập để thực hiện đặt hàng.',
          icon: 'warning',
          confirmButtonText: 'Đăng nhập',
          confirmButtonColor: '#000000'
        }).then((result) => {
          if (result.isConfirmed) {
            const redirectUrl = encodeURIComponent(window.location.href);
            window.location.href = `login.html?redirect=${redirectUrl}`;
          }
        });
        return false;
      }
      return true;
    }

    async function processCheckout() {
      if (!hasItemsInCart) return;

      const formContainer = document.getElementById('checkout-form-container');
      const actionBtn = document.getElementById('main-action-btn');

      if (!isFormVisible) {
        formContainer.style.display = 'block';
        actionBtn.innerText = "Hoàn tất đặt hàng";
        isFormVisible = true;
        return;
      }

      const receiver = document.getElementById('order-receiver').value.trim();
      const phone = document.getElementById('order-phone').value.trim();
      const address = document.getElementById('order-address').value.trim();
      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;

      if (!receiver || !phone || !address) {
        Swal.fire({
          title: 'THIẾU THÔNG TIN',
          text: 'Vui lòng điền đầy đủ thông tin giao hàng để tiến hành đặt hàng.',
          icon: 'warning',
          showConfirmButton: false,
          timer: 2000,
          timerProgressBar: true
        });
        return;
      }

      actionBtn.disabled = true;
      actionBtn.innerText = "Đang xử lý đơn hàng...";

      try {
        const orderRequestData = {
          receiver: receiver,
          address: address,
          phone: phone,
          paymentMethod: paymentMethod
        };

        const response = await apiPost('/order/checkout', orderRequestData);

        if (paymentMethod === 'VNPAY' && response.paymentUrl) {
          Swal.fire({
            title: 'ĐANG CHUYỂN HƯỚNG',
            text: 'Hệ thống đang chuyển hướng bạn sang cổng thanh toán an toàn VNPAY...',
            icon: 'info',
            showConfirmButton: false,
            timer: 1500,
            timerProgressBar: true
          });

          const parser = new DOMParser();
          const decodedDocument = parser.parseFromString(response.paymentUrl, 'text/html');
          const cleanUrl = decodedDocument.body.textContent;

          setTimeout(() => {
            window.location.href = cleanUrl;
          }, 1500);

        } else {
          Swal.fire({
            title: 'ĐẶT HÀNG THÀNH CÔNG',
            text: 'Chúc mừng bạn đã đặt hàng thành công tại Sportify!',
            icon: 'success',
            showConfirmButton: false,
            timer: 1000,
            timerProgressBar: true
          });

          setTimeout(() => {
            window.location.href = "orders.html";
          }, 2000);
        }
      } catch (err) {
        Swal.fire({
          title: 'ĐẶT HÀNG THẤT BẠI',
          text: err.message || "Xảy ra lỗi trong quá trình đặt hàng. Vui lòng thử lại sau.",
          icon: 'error',
          showConfirmButton: false,
          timer: 2000,
          timerProgressBar: true
        });
        actionBtn.disabled = false;
        actionBtn.innerText = "Hoàn tất đặt hàng";
      }
    }
  </script>
</body>

</html>
