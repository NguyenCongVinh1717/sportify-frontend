<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sportify Admin | Quản lý người dùng</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --white: #fff;
      --black: #000;
      --gray: #f8f9fa;
      --border: #eee;
      --text-muted: #666;
      --success: #2ec4b6;
      --danger: #e71d36;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--gray);
      display: flex;
    }

    /* SIDEBAR RESPONSIVE SYNCHRONIZED */
    .sidebar {
      width: 260px;
      background: white;
      height: 100vh;
      position: fixed;
      border-right: 1px solid var(--border);
      z-index: 1500;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 40px 25px;
      font-size: 22px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Nút đóng sidebar trên mobile */
    .close-sidebar-btn {
      display: none;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--black);
    }

    .sidebar-menu {
      padding: 10px 15px;
    }

    .menu-item {
      display: flex;
      gap: 12px;
      padding: 15px 20px;
      border-radius: 4px;
      text-decoration: none;
      color: #666;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .menu-item:hover,
    .menu-item.active {
      background: black;
      color: white;
    }

    /* MOBILE HEADER BAR */
    .mobile-header {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      align-items: center;
      justify-content: space-between;
      z-index: 1400;
    }

    .mobile-brand {
      font-size: 18px;
      font-weight: 800;
    }

    .toggle-sidebar-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }

    /* MAIN CONTENT SECTION RESPONSIVE */
    .main-content {
      flex: 1;
      margin-left: 260px;
      padding: 40px;
      min-width: 0; /* Ngăn flex item làm tràn layout con */
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
      gap: 15px;
    }

    /* TOOLBAR SEARCH */
    .toolbar {
      margin-bottom: 25px;
      background: white;
      padding: 15px;
      border: 1px solid var(--border);
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-box input {
      width: 100%;
      padding: 12px 12px 12px 45px;
      border: 1px solid #ddd;
      outline: none;
      font-weight: 600;
    }

    /* MINIMALIST CARD & TABLE WITH OVERFLOW-X */
    .card {
      background: white;
      border: 1px solid var(--border);
      overflow-x: auto; /* Tạo thanh cuộn ngang khi màn hình quá nhỏ */
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px; /* Đảm bảo cấu trúc cột không bị co ép hẹp dữ liệu */
    }

    th {
      padding: 20px;
      text-align: left;
      border-bottom: 2px solid black;
      font-size: 12px;
      text-transform: uppercase;
      color: #000;
      font-weight: 800;
    }

    td {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* BADGE STATUS STYLE */
    .badge {
      display: inline-block;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      border-radius: 4px;
      white-space: nowrap;
    }

    .badge-active {
      background: #e6f9f5;
      color: var(--success);
    }

    .badge-blocked {
      background: #ffebee;
      color: var(--danger);
    }

    /* DYNAMIC TOGGLE ACTION BUTTON */
    .btn-action {
      padding: 8px 16px;
      background: white;
      border: 1px solid black;
      color: black;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-action.lock:hover {
      background: var(--danger);
      border-color: var(--danger);
      color: white;
    }

    .btn-action.unlock:hover {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    /* SIDEBAR OVERLAY BACKGROUND */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1450;
    }

    /* PAGINATION STYLES */
    .pagination-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background: white;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 15px;
    }

    .pagination-info {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .pagination-buttons {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .page-btn {
      min-width: 36px;
      height: 36px;
      padding: 0 10px;
      border: 1px solid #ddd;
      background: white;
      color: black;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      border-radius: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .page-btn:hover {
      background: #f1f1f1;
    }

    .page-btn.active {
      background: black;
      color: white;
      border-color: black;
    }

    .page-btn:disabled {
      color: #ccc;
      border-color: #eee;
      cursor: not-allowed;
    }

    /* ================= RESPONSIVE MEDIA QUERIES ================= */
    @media (max-width: 992px) {
      .sidebar {
        transform: translateX(-100%); /* Ẩn sidebar mặc định trên mobile */
      }
      .sidebar.open {
        transform: translateX(0); /* Bật sidebar */
      }
      .close-sidebar-btn {
        display: block; /* Hiện nút đóng trong bản menu di động */
      }
      .mobile-header {
        display: flex; /* Hiện header bar di động */
      }
      .sidebar-overlay.open {
        display: block;
      }
      .main-content {
        margin-left: 0;
        padding: 85px 20px 40px 20px; /* Chừa khoảng không phía trên tiêu đề */
      }
    }

    @media (max-width: 576px) {
      .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      /* Responsive đưa các phần tử phân trang vào giữa */
      .pagination-container {
        flex-direction: column;
        justify-content: center;
        text-align: center;
      }
      .pagination-buttons {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <!-- Lớp phủ nền mờ khi mở menu trên điện thoại -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- Thanh đầu trang di động -->
  <div class="mobile-header">
    <button class="toggle-sidebar-btn" onclick="toggleSidebar()">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="mobile-brand">SPORTIFY ADMIN</div>
    <div style="width: 20px;"></div>
  </div>

  <aside class="sidebar" id="sidebarMenu">
    <div class="sidebar-header">
      SPORTIFY ADMIN
      <button class="close-sidebar-btn" onclick="toggleSidebar()">×</button>
    </div>

    <nav class="sidebar-menu">
      <a href="adminDashboard.html" class="menu-item">
        <i class="fa-solid fa-chart-line"></i> THỐNG KÊ
      </a>
      <a href="admin_product.html" class="menu-item"><i class="fa-solid fa-shirt"></i> SẢN PHẨM</a>
      <a href="admin_brand.html" class="menu-item">
        <i class="fa-solid fa-award"></i> THƯƠNG HIỆU
      </a>
      <a href="admin_color.html" class="menu-item">
        <i class="fa-solid fa-palette"></i> MÀU SẮC
      </a>
      <a href="admin_size.html" class="menu-item">
        <i class="fa-solid fa-ruler"></i> KÍCH THƯỚC
      </a>
      <a href="admin_order.html" class="menu-item"><i class="fa-solid fa-cart-shopping"></i> ĐƠN HÀNG</a>
      <a href="admin_customer.html" class="menu-item active">
        <i class="fa-solid fa-user"></i> NGƯỜI DÙNG
      </a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h2 style="font-size:30px; font-weight:800;">Quản lý người dùng</h2>
        <p id="user-count-text" style="color:#666; margin-top:5px;">Danh sách tất cả tài khoản thành viên hệ thống</p>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-user" placeholder="Tìm theo tên hoặc email người dùng..." oninput="filterUsers()">
      </div>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Họ và tên</th>
            <th>Email tài khoản</th>
            <th>Vai trò</th>
            <th>Trạng thái</th>
            <th style="text-align:right;">Hành động</th>
          </tr>
        </thead>
        <tbody id="user-body"></tbody>
      </table>

      <!-- Thanh điều hướng Phân trang (Pagination) -->
      <div class="pagination-container">
        <div class="pagination-info" id="pagination-info">
          Hiển thị 0 - 0 trên tổng số 0 người dùng
        </div>
        <div class="pagination-buttons" id="pagination-buttons"></div>
      </div>
    </div>
  </main>

  <script src="api.js"></script>
  <script>
    // Điều khiển trạng thái ẩn/hiện Sidebar menu di động
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebarMenu');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
    }

    let allUsers = []; 
    let currentPage = 0;
    let totalPages = 0;
    let totalElements = 0;
    const pageSize = 12; // Kích thước trang mặc định

    document.addEventListener('DOMContentLoaded', () => {
      loadUsers(currentPage);
    });

    // 1. Gọi API lấy danh sách phân trang từ Backend: /users?page=...&size=12
    async function loadUsers(page = 0) {
      try {
        const response = await apiGet(`/users?page=${page}&size=${pageSize}`);
        
        if (response && response.content) {
          allUsers = response.content;
          currentPage = response.number;
          totalPages = response.totalPages;
          totalElements = response.totalElements;
        } else if (Array.isArray(response)) {
          allUsers = response;
          currentPage = 0;
          totalPages = 1;
          totalElements = response.length;
        }

        renderUsers(allUsers);
        renderPagination();
        
        document.getElementById('user-count-text').innerText = `Hiện có ${totalElements} tài khoản thành viên hệ thống`;
      } catch (err) {
        Swal.fire('Lỗi', err.message, 'error');
      }
    }

    // 2. Render dữ liệu
    function renderUsers(usersList) {
      const tbody = document.getElementById('user-body');
      if (!usersList || usersList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:40px; color:var(--text-muted);">Không tìm thấy người dùng nào.</td></tr>`;
        return;
      }

      // Lấy email của Admin đang đăng nhập từ Local Storage
      const currentAdminEmail = localStorage.getItem("email");

      tbody.innerHTML = usersList.map(u => {
        const statusBadge = u.enabled
          ? `<span class="badge badge-active">Hoạt động</span>`
          : `<span class="badge badge-blocked">Bị khóa</span>`;

        let actionButton = "";

        if (u.email === currentAdminEmail) {
          actionButton = `<span style="color: #999; font-size: 12px; font-style: italic; font-weight: 700; padding-right: 15px;">Bạn</span>`;
        } else {
          actionButton = u.enabled
            ? `<button class="btn-action lock" onclick="toggleUserStatus(${u.id}, false)"><i class="fa-solid fa-user-slash"></i> Khóa</button>`
            : `<button class="btn-action unlock" onclick="toggleUserStatus(${u.id}, true)"><i class="fa-solid fa-user-check"></i> Mở khóa</button>`;
        }

        return `
          <tr>
            <td>#${u.id}</td>
            <td><strong>${u.fullName || 'Chưa cập nhật'}</strong></td>
            <td>${u.email}</td>
            <td><span style="font-size: 12px; letter-spacing: 0.5px; font-weight: 700;">${u.role}</span></td>
            <td>${statusBadge}</td>
            <td>
              <div style="display:flex; justify-content:flex-end;">
                ${actionButton}
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    // Render các nút Phân trang (Pagination)
    function renderPagination() {
      const infoContainer = document.getElementById('pagination-info');
      const buttonsContainer = document.getElementById('pagination-buttons');

      // 1. Tính toán vị trí hiển thị bắt đầu (startItem) và kết thúc (endItem)
      const startItem = totalElements === 0 ? 0 : currentPage * pageSize + 1;
      const endItem = Math.min((currentPage + 1) * pageSize, totalElements);

      // Hiển thị dạng: Hiển thị 1 - 12 trên tổng số 24 người dùng
      infoContainer.innerText = `Hiển thị ${startItem} - ${endItem} trên tổng số ${totalElements} người dùng`;

      // 2. Cập nhật dãy nút chuyển trang bên phải
      let buttonsHtml = '';

      // Nút Previous
      buttonsHtml += `
        <button class="page-btn" ${currentPage === 0 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
      `;

      // Tạo nút danh sách các trang
      for (let i = 0; i < totalPages; i++) {
        buttonsHtml += `
          <button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">
            ${i + 1}
          </button>
        `;
      }

      // Nút Next
      buttonsHtml += `
        <button class="page-btn" ${currentPage >= totalPages - 1 ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      `;

      buttonsContainer.innerHTML = buttonsHtml;
    }

    // Hàm chuyển trang
    function changePage(pageIndex) {
      if (pageIndex < 0 || pageIndex >= totalPages) return;
      currentPage = pageIndex;
      loadUsers(currentPage);
    }

    // 3. Bộ lọc tìm kiếm theo từ khóa ở trang hiện tại
    function filterUsers() {
      const keyword = document.getElementById('search-user').value.toLowerCase();
      const filtered = allUsers.filter(u =>
        (u.fullName && u.fullName.toLowerCase().includes(keyword)) ||
        (u.email && u.email.toLowerCase().includes(keyword))
      );
      renderUsers(filtered);
    }

    // 4. Gọi API PUT thay đổi trạng thái người dùng
    async function toggleUserStatus(id, targetStatus) {
      const actionText = targetStatus ? "Mở khóa" : "Khóa";
      const confirmResult = await Swal.fire({
        title: `${actionText} tài khoản này?`,
        text: targetStatus ? "Người dùng này có thể đăng nhập lại bình thường." : "Người dùng sẽ bị đá văng khỏi hệ thống lập tức!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: targetStatus ? '#2ec4b6' : '#e71d36',
        confirmButtonText: actionText,
        cancelButtonText: 'Hủy'
      });

      if (!confirmResult.isConfirmed) return;

      try {
        const responseMessage = await apiPut(`/users/${id}/status?enabled=${targetStatus}`);

        Swal.fire('Thành công', responseMessage, 'success');
        loadUsers(currentPage); // Tải lại dữ liệu đúng ở trang hiện tại
      } catch (err) {
        Swal.fire('Lỗi', err.message, 'error');
      }
    }
  </script>
</body>

</html>
