<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportify Admin | Quản lý size</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --white: #fff;
            --black: #000;
            --gray: #f8f9fa;
            --border: #eee;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--gray);
            display: flex;
        }

        /* SIDEBAR RESPONSIVE ĐỒNG BỘ */
        .sidebar {
            width: 260px;
            background: white;
            height: 100vh;
            position: fixed;
            border-right: 1px solid var(--border);
            z-index: 1500;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 40px 25px;
            font-size: 22px;
            font-weight: 800;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Nút đóng menu khi ở trên điện thoại */
        .close-sidebar-btn {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--black);
        }

        .sidebar-menu {
            padding: 10px 15px;
        }

        .menu-item {
            display: flex;
            gap: 12px;
            padding: 15px 20px;
            border-radius: 4px;
            text-decoration: none;
            color: #666;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .menu-item:hover,
        .menu-item.active {
            background: black;
            color: white;
        }

        /* MOBILE HEADER BAR */
        .mobile-header {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            align-items: center;
            justify-content: space-between;
            z-index: 1400;
        }

        .mobile-brand {
            font-size: 18px;
            font-weight: 800;
        }

        .toggle-sidebar-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        /* MAIN CONTENT RESPONSIVE */
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 40px;
            min-width: 0; /* Chống tràn layout */
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            gap: 15px;
        }

        .btn-black {
            background: black;
            color: white;
            border: none;
            padding: 12px 22px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: 700;
            white-space: nowrap;
        }

        /* CARD TABLE CONTAINER */
        .card {
            background: white;
            border: 1px solid var(--border);
            overflow-x: auto; /* Tự động cuộn bảng khi bị màn hình hẹp */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px; /* Chống gãy chữ và co hẹp cột quá đà */
        }

        th {
            padding: 20px;
            text-align: left;
            border-bottom: 2px solid black;
            font-size: 12px;
        }

        td {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 600;
        }

        .btn-icon {
            width: 35px;
            height: 35px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
        }

        .btn-icon:hover {
            background: black;
            color: white;
        }

        /* MODAL RESPONSIVE */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 15px;
        }

        .modal-content {
            background: white;
            width: 500px;
            max-width: 100%;
            padding: 35px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 800;
            font-size: 12px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
        }

        .form-message {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            margin-bottom: 18px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.5;
        }

        .form-message.error {
            display: flex;
            background: #fff1f2;
            border: 1px solid #fecdd3;
            color: #be123c;
        }

        .form-message.success {
            display: flex;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
        }

        /* SIDEBAR OVERLAY BACKGROUND */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1450;
        }

        /* ================= RESPONSIVE QUERIES ================= */
        @media (max-width: 992px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .close-sidebar-btn {
                display: block;
            }
            .mobile-header {
                display: flex;
            }
            .sidebar-overlay.open {
                display: block;
            }
            .main-content {
                margin-left: 0;
                padding: 85px 20px 40px 20px; /* Bù khoảng cách top bằng chiều cao header di động */
            }
        }

        @media (max-width: 576px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .page-header .btn-black {
                width: 100%;
                text-align: center;
            }
            .modal-content {
                padding: 25px 20px;
            }
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Lớp phủ màn hình khi bật Menu ở Mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Thanh công cụ đầu trang trên điện thoại -->
    <div class="mobile-header">
        <button class="toggle-sidebar-btn" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="mobile-brand">SPORTIFY ADMIN</div>
        <div style="width: 20px;"></div>
    </div>

    <aside class="sidebar" id="sidebarMenu">
        <div class="sidebar-header">
            <div class="logo-text">SPORTIFY ADMIN</div>
            <button class="close-sidebar-btn" onclick="toggleSidebar()">×</button>
        </div>

        <nav class="sidebar-menu">
            <a href="adminDashboard.html" class="menu-item">
                <i class="fa-solid fa-chart-line"></i> THỐNG KÊ
            </a>
            <a href="admin_product.html" class="menu-item"><i class="fa-solid fa-shirt"></i> SẢN PHẨM</a>
            <a href="admin_brand.html" class="menu-item">
                <i class="fa-solid fa-award"></i> THƯƠNG HIỆU
            </a>
            <a href="admin_color.html" class="menu-item">
                <i class="fa-solid fa-palette"></i> MÀU SẮC
            </a>
            <a href="admin_size.html" class="menu-item active">
                <i class="fa-solid fa-ruler"></i> KÍCH THƯỚC
            </a>
            <a href="admin_order.html" class="menu-item"><i class="fa-solid fa-cart-shopping"></i> ĐƠN HÀNG</a>
            <a href="admin_customer.html" class="menu-item">
                <i class="fa-solid fa-user"></i> NGƯỜI DÙNG
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <div class="header-title">
                <h2 style="font-size:30px;font-weight:800;">Quản lý size</h2>
                <p style="color:#666;margin-top:5px;">Danh sách kích thước sản phẩm trong hệ thống.</p>
            </div>

            <button class="btn-black" onclick="openModal()">
                <i class="fa-solid fa-plus"></i> THÊM SIZE
            </button>
        </header>

        <div class="card">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>MÃ SIZE</th>
                        <th>TÊN SIZE</th>
                        <th style="text-align:right;">THAO TÁC</th>
                    </tr>
                </thead>
                <tbody id="size-body"></tbody>
            </table>
        </div>
    </main>

    <div class="modal" id="sizeModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; margin-bottom:25px;">
                <h3 id="modalTitle">THÊM SIZE</h3>
                <button onclick="closeModal()" style="border:none;background:none;font-size:22px;cursor:pointer;">
                    ×
                </button>
            </div>

            <form id="sizeForm">
                <input type="hidden" id="s-id">

                <div id="sizeFormMessage" class="form-message"></div>

                <div class="form-group">
                    <label>Mã size</label>
                    <input type="text" id="s-code" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Tên size</label>
                    <input type="text" id="s-name" class="form-control" required>
                </div>

                <div style="display:flex; justify-content:flex-end; gap:10px;">
                    <button type="button" class="btn-black" style="background:#ddd;color:black;" onclick="closeModal()">
                        HỦY
                    </button>
                    <button type="submit" class="btn-black">
                        LƯU
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="api.js"></script>

    <script>
        // Hàm kích hoạt mở/đóng Sidebar trên Mobile
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebarMenu');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        let allSizes = [];

        function getErrorMessage(err) {
            if (!err) return 'Có lỗi xảy ra. Vui lòng thử lại.';
            if (typeof err === 'string') return err;
            if (err.message) return err.message;
            if (err.error) return err.error;
            if (err.detail) return err.detail;
            if (Array.isArray(err)) return err.join(', ');
            if (typeof err === 'object') {
                const values = Object.values(err).filter(v => v != null && v !== '');
                for (const value of values) {
                    if (typeof value === 'string') return value;
                    if (Array.isArray(value) && value.length > 0) return getErrorMessage(value);
                    if (typeof value === 'object') {
                        const nested = getErrorMessage(value);
                        if (nested && nested !== 'Có lỗi xảy ra. Vui lòng thử lại.') return nested;
                    }
                }
                return 'Dữ liệu không hợp lệ. Vui lòng kiểm tra lại.';
            }
            return 'Có lỗi xảy ra. Vui lòng thử lại.';
        }

        function showFormMessage(elId, message, type = 'error') {
            const msgEl = document.getElementById(elId);
            if (!msgEl) return;
            msgEl.textContent = message;
            msgEl.className = `form-message ${type}`;
        }

        function clearFormMessage(elId) {
            const msgEl = document.getElementById(elId);
            if (!msgEl) return;
            msgEl.textContent = '';
            msgEl.className = 'form-message';
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadSizes();
        });

        async function loadSizes() {
            try {
                allSizes = await apiGet('/sizes');
                renderSizes();
            } catch (err) {
                Swal.fire('Lỗi', err.message, 'error');
            }
        }

        function renderSizes() {
            const tbody = document.getElementById('size-body');
            tbody.innerHTML = allSizes.map(s => `
                <tr>
                    <td>#${s.id}</td>
                    <td>
                        <strong>${s.sizeCode}</strong>
                    </td>
                    <td>${s.sizeName}</td>
                    <td>
                        <div style="display:flex;gap:8px;justify-content:flex-end;">
                            <button class="btn-icon" onclick="editSize(${s.id})">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="btn-icon" onclick="deleteSize(${s.id})">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function openModal() {
            document.getElementById('sizeModal').style.display = 'flex';
            document.getElementById('sizeForm').reset();
            clearFormMessage('sizeFormMessage');
            document.getElementById('s-id').value = '';
            document.getElementById('modalTitle').innerText = 'THÊM SIZE';
        }

        function closeModal() {
            clearFormMessage('sizeFormMessage');
            document.getElementById('sizeModal').style.display = 'none';
        }

        document.getElementById('sizeForm').onsubmit = async (e) => {
            e.preventDefault();
            clearFormMessage('sizeFormMessage');
            const id = document.getElementById('s-id').value;
            const body = {
                sizeCode: document.getElementById('s-code').value.trim(),
                sizeName: document.getElementById('s-name').value.trim()
            };

            try {
                if (id) {
                    await apiPut(`/sizes/${id}`, body);
                } else {
                    await apiPost('/sizes', body);
                }
                closeModal();
                loadSizes();
                Swal.fire('Thành công', 'Lưu dữ liệu thành công', 'success');
            } catch (err) {
                showFormMessage('sizeFormMessage', getErrorMessage(err), 'error');
                document.querySelector('#sizeModal .modal-content').scrollTop = 0;
            }
        }

        async function editSize(id) {
            try {
                const s = await apiGet(`/sizes/${id}`);
                openModal();
                document.getElementById('modalTitle').innerText = 'CẬP NHẬT SIZE';
                document.getElementById('s-id').value = s.id;
                document.getElementById('s-code').value = s.sizeCode;
                document.getElementById('s-name').value = s.sizeName;
            } catch (err) {
                Swal.fire('Lỗi', err.message, 'error');
            }
        }

        async function deleteSize(id) {
            const result = await Swal.fire({
                title: 'Xóa size này?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Xóa',
                cancelButtonText: 'Hủy'
            });

            if (!result.isConfirmed) return;

            try {
                await apiDelete(`/sizes/${id}`);
                loadSizes();
                Swal.fire('Đã xóa', '', 'success');
            } catch (err) {
                Swal.fire('Lỗi', err.message, 'error');
            }
        }
    </script>
</body>

</html>
