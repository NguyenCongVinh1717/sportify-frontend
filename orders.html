<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đơn hàng của tôi | Sportify Premium Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tích hợp SweetAlert2 để đồng bộ thông báo và xác nhận đẹp mắt -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    :root {
      --white: #ffffff;
      --black: #000000;
      --gray-bg: #f8f9fa;
      --gray-light: #f1f3f5;
      --gray-border: #dee2e6;
      --gray-dark: #212529;
      --text-muted: #6c757d;
      --radius: 4px; /* Bo góc nhẹ kiểu cá tính, vuông vắn */
      --transition: all 0.2s ease-in-out;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
    }

    body { 
      background-color: var(--white); 
      color: var(--black); 
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== HEADER ===== */
    .topbar {
      background: var(--white);
      border-bottom: 2px solid var(--black); 
      padding: 20px 0; 
      width: 100%;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-inner {
      max-width: 900px; 
      margin: 0 auto; 
      padding: 0 24px;
      display: flex; 
      align-items: center; 
      justify-content: space-between;
    }

    .brand-wrapper {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .brand-logo {
      width: 32px; 
      height: 32px;
      background: var(--black); 
      border-radius: var(--radius);
      display: flex; 
      align-items: center; 
      justify-content: center;
    }
    
    .brand-logo i { color: var(--white); font-size: 14px; }
    .brand-title { font-size: 22px; font-weight: 900; font-style: italic; letter-spacing: -0.5px; color: var(--black); margin-left: 10px; text-transform: uppercase; }

    /* ===== CONTAINER ===== */
    .container {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .page-header {
      margin-bottom: 32px;
      border-bottom: 1px solid var(--gray-border);
      padding-bottom: 12px;
    }

    .page-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    /* ===== TABS FILTER & BADGES ===== */
    .filter-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 32px;
      overflow-x: auto;
      border-bottom: 1px solid var(--gray-border);
      padding-bottom: 0;
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
    }

    .tab-btn:hover {
      color: var(--black);
    }

    .tab-btn.active {
      color: var(--black);
      border-bottom: 2px solid var(--black);
      font-weight: 700;
    }

    /* Badge số lượng đơn hàng */
    .tab-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--black);
      color: var(--white);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
      min-width: 18px;
      height: 18px;
      line-height: 1;
    }

    .tab-btn.active .tab-badge {
      background-color: var(--black);
      color: var(--white);
    }

    .status-view {
      text-align: center;
      padding: 60px 20px;
      background: var(--white);
      border: 1px solid var(--gray-border);
      border-radius: var(--radius);
    }

    /* ===== ĐƠN HÀNG BLOCK ===== */
    .orders-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .order-card {
      background: var(--white);
      border: 1px solid var(--black);
      border-radius: var(--radius);
      padding: 24px;
      transition: var(--transition);
    }

    .order-card:hover {
      box-shadow: 4px 4px 0px var(--black);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--gray-border);
      margin-bottom: 20px;
    }

    .order-tag {
      font-size: 14px;
      font-weight: 700;
      color: var(--black);
    }

    .order-status {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.3px;
    }

    .status-unpaid { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .status-pending { background: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; }
    .status-shipping { background: #cce5ff; color: #004085; border: 1px solid #b8daff; }
    .status-delivered { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-cancelled { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    /* Layout hàng thông tin */
    .order-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 14px;
    }

    .info-label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .info-value {
      color: var(--black);
      font-weight: 600;
      text-align: right;
    }

    /* ===== TỐI ƯU RESPONSIVE FOOTER ===== */
    .order-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid var(--gray-border);
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-left: auto; /* Đẩy cụm thông tin tổng tiền luôn bám sang lề phải cực chuẩn */
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .method-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--black);
    }

    .total-container {
      text-align: right;
    }

    .total-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      display: block;
    }

    .total-price {
      font-size: 20px;
      font-weight: 800;
      color: var(--black);
    }

    /* ===== BUTTONS ===== */
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--black);
      color: var(--white);
      font-weight: 700;
      text-decoration: none;
      border-radius: var(--radius);
      text-transform: uppercase;
      font-size: 12px;
      border: 1px solid var(--black);
      cursor: pointer;
      transition: var(--transition);
    }

    .action-btn:hover {
      background: #212529;
    }

    .btn-secondary {
      background: var(--white);
      color: var(--black);
      border: 1px solid var(--black);
    }
    
    .btn-secondary:hover {
      background: var(--black);
      color: var(--white);
    }

    .btn-danger {
      background: #dc3545;
      color: var(--white);
      border: 1px solid #dc3545;
    }

    .btn-danger:hover {
      background: #bb2d3b;
      border-color: #b02a37;
    }

    /* ===== MODAL ===== */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition);
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--white);
      border: 2px solid var(--black);
      border-radius: var(--radius);
      width: 100%;
      max-width: 550px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 30px;
      transform: translateY(10px);
      transition: var(--transition);
    }

    .modal-backdrop.open .modal-content {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--black);
      padding-bottom: 10px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .close-modal-btn {
      background: none; border: none;
      font-size: 22px; color: var(--black);
      cursor: pointer;
    }

    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px dashed var(--gray-border);
    }
    
    .product-info-name { font-weight: 700; font-size: 14px; color: var(--black); }
    .product-info-qty { font-size: 13px; color: var(--text-muted); margin-top: 2px; display: block; }
    .product-info-price { font-weight: 700; font-size: 14px; color: var(--black); }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 2px solid var(--black);
    }

    /* ĐÈ PHONG CÁCH SWEETALERT2 CHO PHÙ HỢP BRAND SPORTIFY */
    .swal2-popup {
      border: 2px solid var(--black) !important;
      border-radius: var(--radius) !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
    }
    .swal2-styled.swal2-confirm {
      background-color: var(--black) !important;
      border-radius: var(--radius) !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      font-size: 13px !important;
    }
    .swal2-styled.swal2-cancel {
      border-radius: var(--radius) !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      font-size: 13px !important;
    }

    /* Responsive cho màn hình nhỏ hơn 600px */
    @media (max-width: 600px) {
      .order-footer {
        flex-direction: column;
        align-items: stretch;
      }
      .footer-left {
        justify-content: space-between;
        width: 100%;
      }
      .footer-right {
        width: 100%;
        justify-content: space-between;
        margin-left: 0;
        border-top: 1px dashed var(--gray-border);
        padding-top: 12px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="products.html" class="brand-wrapper">
        <div class="brand-logo">
          <i class="fa-solid fa-bolt-lightning"></i>
        </div>
        <div class="brand-title">SPORTIFY</div>
      </a>
      <a href="products.html" class="action-btn btn-secondary">
        <i class="fa-solid fa-arrow-left"></i> Quay lại cửa hàng
      </a>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h1 class="page-title">Đơn hàng của tôi</h1>
    </div>

    <!-- Thanh bộ lọc trạng thái -->
    <div class="filter-tabs" id="filter-tabs-container">
      <button class="tab-btn active" onclick="switchTab('ALL')">Tất cả <span class="tab-badge" id="badge-ALL" style="display: none;">0</span></button>
      <button class="tab-btn" onclick="switchTab('UNPAID')">Chờ thanh toán <span class="tab-badge" id="badge-UNPAID" style="display: none;">0</span></button>
      <button class="tab-btn" onclick="switchTab('PENDING')">Chờ duyệt <span class="tab-badge" id="badge-PENDING" style="display: none;">0</span></button>
      <button class="tab-btn" onclick="switchTab('SHIPPING')">Đang giao <span class="tab-badge" id="badge-SHIPPING" style="display: none;">0</span></button>
      <button class="tab-btn" onclick="switchTab('DELIVERED')">Đã giao <span class="tab-badge" id="badge-DELIVERED" style="display: none;">0</span></button>
      <button class="tab-btn" onclick="switchTab('CANCELLED')">Đã hủy <span class="tab-badge" id="badge-CANCELLED" style="display: none;">0</span></button>
    </div>

    <div id="loading-view" class="status-view">
      <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; color: var(--black); margin-bottom: 14px;"></i>
      <p style="font-weight: 600; color: var(--black); font-size: 14px;">Đang tải lịch sử mua sắm của bạn...</p>
    </div>

    <div id="empty-view" class="status-view" style="display: none;">
      <i class="fa-solid fa-bag-shopping" style="font-size: 32px; color: var(--text-muted); margin-bottom: 14px;"></i>
      <p style="font-weight: 600; color: var(--text-muted); font-size: 14px; margin-bottom: 18px;">Không tìm thấy đơn hàng nào.</p>
      <a href="products.html" class="action-btn" style="font-size: 11px;">Khám phá sản phẩm ngay</a>
    </div>

    <div id="orders-container" class="orders-list" style="display: none;"></div>
  </main>

  <!-- Chi tiết đơn hàng (Modal) -->
  <div id="detail-modal" class="modal-backdrop" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-order-id">Chi tiết đơn hàng</h3>
        <button class="close-modal-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="order-body" style="border-bottom: 1px solid var(--black); padding-bottom: 16px;">
        <div class="info-row"><span class="info-label">Người nhận hàng</span><span class="info-value" id="modal-receiver"></span></div>
        <div class="info-row"><span class="info-label">Số điện thoại</span><span class="info-value" id="modal-phone"></span></div>
        <div class="info-row"><span class="info-label">Địa chỉ nhận</span><span class="info-value" id="modal-address"></span></div>
        <div class="info-row"><span class="info-label">Phương thức TT</span><span class="info-value" id="modal-method"></span></div>
        <div class="info-row" id="modal-payurl-row" style="display:none;"><span class="info-label">Link thanh toán</span><span class="info-value"><a id="modal-payurl" href="#" target="_blank" style="color:var(--black); font-weight:800; text-decoration: underline;">Thanh toán ngay</a></span></div>
      </div>
      <h4 style="font-size: 13px; font-weight: 800; margin: 20px 0 10px 0; text-transform: uppercase; letter-spacing: 0.5px;">Danh sách sản phẩm</h4>
      <div id="modal-products-list" style="margin-bottom: 20px;"></div>
      <div class="info-row" style="padding-top: 12px; border-top: 1px solid var(--black);">
        <span class="info-label" style="font-size: 14px; font-weight: 700; color: var(--black);">Tổng thanh toán</span>
        <span class="info-value" id="modal-total-price" style="font-size: 22px; font-weight: 800; color: var(--black);"></span>
      </div>

      <div class="modal-footer" id="modal-action-footer"></div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    let globalOrdersArray = [];
    let currentFilterStatus = "ALL";

    document.addEventListener("DOMContentLoaded", async function() {
      await loadMyOrders();
    });

    // HÀM HIỂN THỊ THÔNG BÁO ĐỒNG BỘ QUA SWEETALERT2 TOAST (Dùng cho các thông báo nhỏ góc màn hình nếu cần)
    function showToast(message, type = "success") {
      const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true,
        didOpen: (toast) => {
          toast.addEventListener('mouseenter', Swal.stopTimer)
          toast.addEventListener('mouseleave', Swal.resumeTimer)
        }
      });

      Toast.fire({
        icon: type,
        title: message
      });
    }

    async function loadMyOrders() {
      const loadingView = document.getElementById("loading-view");
      loadingView.style.display = "block";
      document.getElementById("orders-container").style.display = "none";
      document.getElementById("empty-view").style.display = "none";

      try {
        const responseOrders = await apiGet("/order/myOrders");
        loadingView.style.display = "none";

        if (!responseOrders || responseOrders.length === 0) {
          document.getElementById("empty-view").style.display = "block";
          globalOrdersArray = [];
          updateTabBadges();
          return;
        }

        globalOrdersArray = responseOrders.reverse();
        updateTabBadges();
        renderOrders();

      } catch (error) {
        console.error("Lỗi nạp danh sách đơn hàng:", error);
        loadingView.innerHTML = `
          <i class="fa-solid fa-triangle-exclamation" style="font-size: 20px; color: var(--black); margin-bottom: 12px;"></i>
          <p style="font-weight: 600; color: var(--black); font-size: 14px;">Không thể đồng bộ: ${error.message || "Phiên làm việc hết hạn"}</p>
        `;
      }
    }

    // ĐẾM SỐ LƯỢNG ĐƠN HÀNG VÀ HIỂN THỊ BADGE (NẾU > 0)
    function updateTabBadges() {
      const counts = {
        ALL: globalOrdersArray.length,
        UNPAID: 0,
        PENDING: 0,
        SHIPPING: 0,
        DELIVERED: 0,
        CANCELLED: 0
      };

      globalOrdersArray.forEach(order => {
        if (counts.hasOwnProperty(order.status)) {
          counts[order.status]++;
        }
      });

      Object.keys(counts).forEach(status => {
        const badgeElement = document.getElementById(`badge-${status}`);
        if (badgeElement) {
          const count = counts[status];
          if (count > 0) {
            badgeElement.innerText = count;
            badgeElement.style.display = "inline-flex";
          } else {
            badgeElement.style.display = "none";
          }
        }
      });
    }

    function switchTab(status) {
      currentFilterStatus = status;
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      event.currentTarget.classList.add("active");
      renderOrders();
    }

    function renderOrders() {
      const emptyView = document.getElementById("empty-view");
      const ordersContainer = document.getElementById("orders-container");
      
      ordersContainer.innerHTML = "";

      const filteredOrders = currentFilterStatus === "ALL" 
        ? globalOrdersArray 
        : globalOrdersArray.filter(order => order.status === currentFilterStatus);

      if (filteredOrders.length === 0) {
        emptyView.style.display = "block";
        ordersContainer.style.display = "none";
        return;
      }

      emptyView.style.display = "none";
      ordersContainer.style.display = "flex";

      filteredOrders.forEach(order => {
        let statusClass = "";
        let statusText = "";
        let statusIcon = "";

        switch (order.status) {
          case "UNPAID":
            statusClass = "status-unpaid"; statusText = "Chưa thanh toán";
            statusIcon = '<i class="fa-regular fa-clock"></i>';
            break;
          case "PENDING":
            statusClass = "status-pending"; statusText = "Chờ duyệt";
            statusIcon = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            break;
          case "SHIPPING":
            statusClass = "status-shipping"; statusText = "Đang giao";
            statusIcon = '<i class="fa-solid fa-truck-fast"></i>';
            break;
          case "DELIVERED":
            statusClass = "status-delivered"; statusText = "Đã giao";
            statusIcon = '<i class="fa-solid fa-circle-check"></i>';
            break;
          case "CANCELLED":
            statusClass = "status-cancelled"; statusText = "Đã hủy đơn";
            statusIcon = '<i class="fa-solid fa-circle-xmark"></i>';
            break;
          default:
            statusClass = "status-unpaid"; statusText = order.status || "Đang xử lý";
            statusIcon = '<i class="fa-solid fa-circle-question"></i>';
        }

        let methodIcon = '<i class="fa-solid fa-money-bill-wave"></i>';
        let methodText = "COD";

        if (order.paymentMethod === "VNPAY" || order.paymentMethod === "ONLINE") {
          methodIcon = '<i class="fa-solid fa-credit-card"></i>';
          methodText = "VNPay";
        }

        let cancelBtnHtml = "";
        if (order.status === "UNPAID" || order.status === "PENDING") {
          cancelBtnHtml = `
            <button class="action-btn btn-danger" onclick="cancelOrder(${order.id}, event)">
              <i class="fa-solid fa-ban"></i> Hủy đơn
            </button>
          `;
        }

        const orderCard = document.createElement("div");
        orderCard.className = "order-card";
        orderCard.innerHTML = `
          <div class="order-header">
            <span class="order-tag">ĐƠN HÀNG #${order.id}</span>
            <span class="order-status ${statusClass}">
              ${statusIcon} ${statusText}
            </span>
          </div>
          
          <div class="order-body">
            <div class="info-row">
              <span class="info-label">Người nhận</span>
              <span class="info-value">${order.receiver || "---"}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Số điện thoại</span>
              <span class="info-value">${order.phone || "---"}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Địa chỉ giao hàng</span>
              <span class="info-value">${order.address || "---"}</span>
            </div>
          </div>
          
          <div class="order-footer">
            <div class="footer-left">
              <button class="action-btn btn-secondary" onclick="openOrderDetailModal(${order.id})">
                Xem chi tiết
              </button>
              ${cancelBtnHtml}
            </div>
            <div class="footer-right">
              <div class="method-badge">
                ${methodIcon} <span>${methodText}</span>
              </div>
              <div class="total-container">
                <span class="total-label">Tổng tiền</span>
                <span class="total-price">${(order.totalPrice || 0).toLocaleString('vi-VN')}đ</span>
              </div>
            </div>
          </div>
        `;
        ordersContainer.appendChild(orderCard);
      });
    }

    function openOrderDetailModal(orderId) {
      const order = globalOrdersArray.find(o => o.id === orderId);
      if (!order) return;

      document.getElementById("modal-order-id").innerText = `ĐƠN HÀNG #${order.id}`;
      document.getElementById("modal-receiver").innerText = order.receiver || "---";
      document.getElementById("modal-phone").innerText = order.phone || "---";
      document.getElementById("modal-address").innerText = order.address || "---";
      document.getElementById("modal-method").innerText = order.paymentMethod || "COD";
      document.getElementById("modal-total-price").innerText = `${(order.totalPrice || 0).toLocaleString('vi-VN')}đ`;

      const payRow = document.getElementById("modal-payurl-row");
      if (order.status === "UNPAID" && order.paymentUrl) {
        payRow.style.display = "flex";
        document.getElementById("modal-payurl").href = order.paymentUrl;
      } else {
        payRow.style.display = "none";
      }

      const productsListContainer = document.getElementById("modal-products-list");
      productsListContainer.innerHTML = "";

      if (order.items && order.items.length > 0) {
        order.items.forEach(item => {
          const itemDiv = document.createElement("div");
          itemDiv.className = "product-item";
          itemDiv.innerHTML = `
            <div>
              <span class="product-info-name">${item.productName || "Sản phẩm"}</span>
              <span class="product-info-qty">Số lượng: x${item.quantity || 1}</span>
            </div>
            <span class="product-info-price">${((item.price || 0) * (item.quantity || 1)).toLocaleString('vi-VN')}đ</span>
          `;
          productsListContainer.appendChild(itemDiv);
        });
      } else {
        productsListContainer.innerHTML = `<p style="font-size:13px; color:var(--text-muted); text-align:center; padding: 10px 0;">Không có dữ liệu chi tiết mặt hàng.</p>`;
      }

      const modalActionFooter = document.getElementById("modal-action-footer");
      if (order.status === "UNPAID" || order.status === "PENDING") {
        modalActionFooter.style.display = "flex";
        modalActionFooter.innerHTML = `
          <span style="font-size: 11px; color: var(--text-muted); font-weight: 500;">Bạn có thể hủy đơn hàng trước khi giao.</span>
          <button class="action-btn btn-danger" onclick="cancelOrder(${order.id}, event, true)">
            <i class="fa-solid fa-ban"></i> Hủy đơn hàng
          </button>
        `;
      } else {
        modalActionFooter.style.display = "none";
      }

      document.getElementById("detail-modal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("detail-modal").classList.remove("open");
    }

   // SỬA HÀM HỦY ĐƠN - THÀNH CÔNG TỰ ĐỘNG BIẾN MẤT KHÔNG CẦN NÚT
    async function cancelOrder(orderId, event, isFromModal = false) {
      if (event) event.stopPropagation();

      // 1. Hộp thoại xác nhận hủy đơn (To ở giữa, cần bấm xác nhận)
      const result = await Swal.fire({
        title: 'XÁC NHẬN HỦY ĐƠN?',
        text: `Bạn có chắc chắn muốn hủy Đơn hàng #${orderId} không? Hành động này không thể hoàn tác.`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#000000', // Màu đen thương hiệu Sportify
        cancelButtonColor: '#dc3545',  // Màu đỏ nguy hiểm
        confirmButtonText: 'ĐỒNG Ý HỦY',
        cancelButtonText: 'QUAY LẠI'
      });

      if (!result.isConfirmed) return;

      try {
        // Gọi API hủy đơn
        await apiPut(`/order/cancel-order/${orderId}`);
        
        // 2. Hộp thoại thông báo THÀNH CÔNG (To ở giữa, tự biến mất sau 2 giây)
        await Swal.fire({
          title: 'HỦY ĐƠN THÀNH CÔNG!',
          text: `Đơn hàng #${orderId} của bạn đã được hủy thành công khỏi hệ thống.`,
          icon: 'success',
          showConfirmButton: false, // Ẩn nút "Đồng ý"
          timer: 1000,              // Tự động đóng sau 2000 mili-giây (2 giây)
          timerProgressBar: true    // Hiển thị thanh thời gian chạy phía dưới cho đẹp mắt
        });

        if (isFromModal) {
          closeModal();
        }

        // Cập nhật cấu trúc mảng cục bộ
        const index = globalOrdersArray.findIndex(o => o.id === orderId);
        if (index !== -1) {
          globalOrdersArray[index].status = "CANCELLED";
        }

        updateTabBadges();
        renderOrders();

      } catch (error) {
        console.error("Lỗi khi hủy đơn:", error);
        
        // 3. Hộp thoại thông báo THẤT BẠI (Vẫn giữ nút ĐỒNG Ý để người dùng kịp đọc lỗi)
        await Swal.fire({
          title: 'HỦY ĐƠN THẤT BẠI',
          text: error.message || "Không thể hủy đơn hàng vào lúc này. Vui lòng thử lại sau.",
          icon: 'error',
          confirmButtonColor: '#000000',
          confirmButtonText: 'ĐỒNG Ý'
        });
      }
    }
  </script>
