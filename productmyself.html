<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết sản phẩm | Sportify Premium Store</title>
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    /* --- HỆ THỐNG BIẾN MÀU MONOCHROME PREMIUM --- */
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f9f9f9;
      --text-main: #111111;
      --text-muted: #767676;
      --gray-border: #e5e5e5;
      --accent-color: #0071e3; 
      --danger: #d9383a;
      --star-color: #111111;
      --radius-sm: 4px;
      --radius-md: 6px;
      --font-main: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* --- LAYOUT CHÍNH (ĐÃ THU NHỎ GỌN GÀNG) --- */
    .premium-section-container {
      max-width: 1100px; /* Thu hẹp chiều rộng tổng thể để giao diện cô đọng */
      margin: 30px auto;
      padding: 0 20px;
    }

    .premium-block-wrapper {
      background: var(--bg-primary);
      border: 1px solid var(--gray-border);
      border-radius: var(--radius-sm);
      padding: 24px;
      margin-top: 20px;
    }

    .section-premium-title {
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-main);
      margin-bottom: 15px;
      border-left: 3px solid var(--text-main);
      padding-left: 12px;
      line-height: 1.2;
    }

    /* --- KHUNG CHI TIẾT SẢN PHẨM CHÍNH (MAIN PRODUCT GRID) --- */
    .product-detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: start;
    }

    @media (max-width: 768px) {
      .product-detail-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }

    /* Khối ảnh bên trái */
    .product-gallery-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .main-image-viewport {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--gray-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .main-image-viewport img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-nav-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-gallery-nav {
      background: var(--bg-primary);
      border: 1px solid var(--gray-border);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: var(--radius-sm);
      color: var(--text-main);
      transition: all 0.2s;
    }

    .btn-gallery-nav:hover {
      border-color: var(--text-main);
    }

    .thumbnail-scroll-pane {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      flex-grow: 1;
      scrollbar-width: none;
    }

    .thumbnail-scroll-pane::-webkit-scrollbar {
      display: none;
    }

    .thumb-item-box {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      border: 1px solid var(--gray-border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      overflow: hidden;
      background: var(--bg-secondary);
      transition: border-color 0.2s;
    }

    .thumb-item-box.active, .thumb-item-box:hover {
      border-color: var(--text-main);
      border-width: 2px;
    }

    .thumb-item-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Khối thông tin bên phải */
    .product-info-panel {
      display: flex;
      flex-direction: column;
    }

    .brand-badge {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .product-main-name {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .product-price-tag {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--gray-border);
    }

    /* Khung chứa các biến thể (Gọn gàng, vừa vặn) */
    .variants-selection-card {
      background: var(--bg-secondary);
      border: 1px solid var(--gray-border);
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-bottom: 20px;
    }

    .variant-group-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .variant-options-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .variant-options-list:last-child {
      margin-bottom: 0;
    }

    .btn-variant-choice {
      background: var(--bg-primary);
      border: 1px solid var(--gray-border);
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .btn-variant-choice:hover {
      border-color: var(--text-main);
    }

    .btn-variant-choice.active {
      background: var(--text-main);
      color: var(--bg-primary);
      border-color: var(--text-main);
    }

    .btn-variant-choice:disabled {
      opacity: 0.4;
      text-decoration: line-through;
      cursor: not-allowed;
    }

    /* Số lượng & Nút mua hàng */
    .quantity-purchase-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    .quantity-counter-box {
      display: flex;
      align-items: center;
      border: 1px solid var(--gray-border);
      border-radius: var(--radius-sm);
      background: var(--bg-primary);
      height: 42px;
    }

    .btn-qty-adjust {
      background: transparent;
      border: none;
      width: 36px;
      height: 100%;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-main);
    }

    .input-qty-value {
      width: 40px;
      text-align: center;
      border: none;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      outline: none;
    }

    .btn-add-to-cart {
      flex-grow: 1;
      height: 42px;
      background: var(--text-main);
      color: var(--bg-primary);
      border: 1px solid var(--text-main);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-add-to-cart:hover {
      background: var(--bg-primary);
      color: var(--text-main);
    }

    /* --- MÔ TẢ SẢN PHẨM --- */
    .product-description-content {
      font-size: 14px;
      color: #333;
      line-height: 1.6;
    }

    /* --- PHẦN KHU VỰC BÌNH LUẬN & ĐÁNH GIÁ --- */
    .review-writing-box {
      background: var(--bg-secondary);
      border: 1px solid var(--gray-border);
      border-radius: var(--radius-sm);
      padding: 20px;
      margin-bottom: 24px;
    }

    .star-picker-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .star-picker-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }

    #star-picker-container i {
      font-size: 16px;
      color: #ddd;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    #star-picker-container i.active {
      color: var(--star-color);
    }

    .comment-textarea-wrapper {
      position: relative;
      margin-bottom: 15px;
    }

    #comment-input-text {
      width: 100%;
      height: 80px;
      padding: 12px;
      border: 1px solid var(--gray-border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: inherit;
      color: var(--text-main);
      resize: none;
      outline: none;
      transition: border-color 0.2s ease;
    }
    #comment-input-text:focus {
      border-color: var(--text-main);
    }

    .btn-submit-comment {
      background: var(--text-main);
      color: var(--bg-primary);
      border: 1px solid var(--text-main);
      padding: 8px 24px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-submit-comment:hover {
      background: var(--bg-primary);
      color: var(--text-main);
    }

    #comment-list-target {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .comment-card-item {
      padding: 16px 0;
      border-bottom: 1px solid var(--gray-border);
    }
    .comment-card-item:last-child {
      border-bottom: none;
    }

    .comment-user-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .comment-user-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    .comment-stars-view i {
      font-size: 11px;
      color: var(--star-color);
      margin-left: 2px;
    }

    .comment-text-content {
      font-size: 14px;
      color: #333;
      line-height: 1.5;
      margin: 0;
      white-space: pre-line;
    }

    /* --- PHẦN KHU VỰC SẢN PHẨM LIÊN QUAN --- */
    .related-grid-layout {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 992px) {
      .related-grid-layout { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .related-grid-layout { grid-template-columns: repeat(2, 1fr); }
    }

    .related-card {
      display: block;
      text-decoration: none;
      background: var(--bg-primary);
      border: 1px solid var(--gray-border);
      border-radius: var(--radius-sm);
      padding: 12px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .related-card:hover {
      border-color: var(--text-main);
      transform: translateY(-2px);
    }

    .related-img-wrapper {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background: var(--bg-secondary);
      margin-bottom: 10px;
      overflow: hidden;
    }
    .related-img-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .related-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.4;
      height: 36px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .related-price {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }

    .related-actions-row {
      text-align: center;
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn-premium-outline {
      background: var(--bg-primary);
      color: var(--text-main);
      border: 1px solid var(--text-main);
      padding: 8px 24px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-premium-outline:hover {
      background: var(--text-main);
      color: var(--bg-primary);
    }
    .btn-premium-outline:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- =========================================================
       📦 KHU VỰC THÔNG TIN CHÍ TIẾT SẢN PHẨM CHÍNH (PHẦN 1)
       ========================================================= -->
  <main class="premium-section-container">
    <div class="premium-block-wrapper">
      <div class="product-detail-grid">
        
        <!-- Gallery ảnh sản phẩm bên trái -->
        <div class="product-gallery-container">
          <div class="main-image-viewport">
            <img id="main-product-img" src="https://via.placeholder.com/500" alt="Sản phẩm">
          </div>
          <div class="gallery-nav-row">
            <button class="btn-gallery-nav" onclick="navigateGallery(-1)">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div class="thumbnail-scroll-pane" id="thumb-pane-target">
              <!-- Render danh sách thumbnail -->
            </div>
            <button class="btn-gallery-nav" onclick="navigateGallery(1)">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
        </div>

        <!-- Panel thông tin đặt hàng bên phải -->
        <div class="product-info-panel">
          <div class="brand-badge" id="product-brand-target">Thương hiệu</div>
          <h1 class="product-main-name" id="product-name-target">Tên sản phẩm đang tải...</h1>
          <div class="product-price-tag" id="product-price-target">0đ</div>

          <!-- Khung tùy chọn biến thể gọn gàng -->
          <div class="variants-selection-card">
            <div class="variant-group-title">Màu sắc</div>
            <div class="variant-options-list" id="color-variant-target">
              <!-- Render nút chọn màu -->
            </div>

            <div class="variant-group-title">Kích cỡ</div>
            <div class="variant-options-list" id="size-variant-target">
              <!-- Render nút chọn size -->
            </div>
          </div>

          <!-- Điều khiển số lượng & Giỏ hàng -->
          <div class="quantity-purchase-row">
            <div class="quantity-counter-box">
              <button class="btn-qty-adjust" onclick="adjustPurchaseQty(-1)">
                <i class="fa-solid fa-minus"></i>
              </button>
              <input type="text" class="input-qty-value" id="qty-input-field" value="1" readonly>
              <button class="btn-qty-adjust" onclick="adjustPurchaseQty(1)">
                <i class="fa-solid fa-plus"></i>
              </button>
            </div>
            <button class="btn-add-to-cart" onclick="addProductToCart()">
              Thêm vào giỏ hàng
            </button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Phân đoạn: Mô tả chi tiết sản phẩm -->
  <section class="premium-section-container">
    <div class="section-premium-title">Mô tả sản phẩm</div>
    <div class="premium-block-wrapper">
      <div class="product-description-content" id="product-desc-target">
        Nội dung mô tả chi tiết đang được cập nhật...
      </div>
    </div>
  </section>

  <!-- =========================================================
       📦 KHU VỰC BÌNH LUẬN VÀ SẢN PHẨM LIÊN QUAN (PHẦN 2)
       ========================================================= -->
  
  <!-- Phân đoạn: Đánh giá từ khách hàng -->
  <section class="premium-section-container">
    <div class="section-premium-title">Đánh giá sản phẩm</div>
    
    <div class="premium-block-wrapper">
      <div class="review-writing-box">
        <div class="star-picker-row">
          <span class="star-picker-label">Xếp hạng của bạn:</span>
          <div id="star-picker-container">
            <i class="fa-solid fa-star active" data-value="1" onclick="handleStarSelect(1)"></i>
            <i class="fa-solid fa-star active" data-value="2" onclick="handleStarSelect(2)"></i>
            <i class="fa-solid fa-star active" data-value="3" onclick="handleStarSelect(3)"></i>
            <i class="fa-solid fa-star active" data-value="4" onclick="handleStarSelect(4)"></i>
            <i class="fa-solid fa-star active" data-value="5" onclick="handleStarSelect(5)"></i>
          </div>
        </div>
        <div class="comment-textarea-wrapper">
          <textarea id="comment-input-text" placeholder="Chia sẻ trải nghiệm thực tế của bạn về kích cỡ, chất liệu, form dáng sản phẩm..."></textarea>
        </div>
        <button class="btn-submit-comment" onclick="submitProductComment()">Gửi đánh giá</button>
      </div>

      <div id="comment-list-target">
        <!-- Dữ liệu bình luận render tại đây -->
      </div>
    </div>
  </section>

  <!-- Phân đoạn: Sản phẩm liên quan -->
  <section class="premium-section-container related-section">
    <div class="section-premium-title">Sản phẩm liên quan</div>
    
    <div class="premium-block-wrapper">
      <div class="related-grid-layout" id="related-list-target">
        <div id="related-loading-spinner" style="padding: 30px 0; text-align: center; color: var(--text-muted); grid-column: 1/-1;">
          <i class="fa-solid fa-spinner fa-spin" style="margin-right: 8px;"></i> Đang tải danh sách sản phẩm liên quan...
        </div>
      </div>

      <div class="related-actions-row">
        <button class="btn-premium-outline" id="btn-load-more-related" onclick="loadNextRelatedPage()">
          Xem thêm sản phẩm
        </button>
        <button class="btn-premium-outline" id="btn-collapse-related" onclick="collapseRelatedToDefault()" style="display: none; background: #6b7280; color: #fff; border-color: #6b7280;">
          Thu gọn danh sách
        </button>
      </div>
    </div>
  </section>

  <!-- =========================================================
       ✨ LOGIC XỬ LÝ SỰ KIỆN TOÀN TRANG (JAVASCRIPT)
       ========================================================= -->
  <script>
    /* Giả định các biến cấu hình toàn cục từ Phần 1 */
    const API_BASE = "https://api.example.com"; // Thay bằng url api thực tế của bạn
    const IMG_BASE = "https://api.example.com/images/";
    const IMG_BASE_FALLBACK = "https://api.example.com/fallback-images/";
    
    let productId = new URLSearchParams(window.location.search).get('id') || 1;
    let currentSelectedRating = 5;
    let currentRelatedPage = 0;
    const RELATED_PAGE_SIZE = 4;
    let accessToken = localStorage.getItem('accessToken') || null;

    /* Các hàm bổ trợ kiểm tra đăng nhập cơ bản */
    function isUserLoggedIn() {
      return Boolean(localStorage.getItem('fullName') || localStorage.getItem('email') || accessToken);
    }
    function buildCommentRedirectUrl() {
      return window.location.href;
    }
    function isOwnComment(comment) {
      // Logic kiểm tra chủ sở hữu bình luận tùy thuộc vào cấu trúc dự án của bạn
      return comment.username === localStorage.getItem('username');
    }

    /* Các hàm API mẫu để chạy đúng cấu trúc code hiện tại */
    async function apiGet(endpoint) { return fetch(API_BASE + endpoint).then(res => res.json()); }
    async function apiPost(endpoint, body) { return fetch(API_BASE + endpoint, { method: 'POST', body: JSON.stringify(body), headers: {'Content-Type': 'application/json'} }).then(res => res.json()); }
    async function apiPut(endpoint, body) { return fetch(API_BASE + endpoint, { method: 'PUT', body: JSON.stringify(body), headers: {'Content-Type': 'application/json'} }).then(res => res.json()); }
    async function apiDelete(endpoint) { return fetch(API_BASE + endpoint, { method: 'DELETE' }).then(res => res.json()); }

    /* Giả lập hàm khởi tạo trang */
    function initPage() {
      loadCommentsUI();
      fetchRelatedProducts();
    }

    /* --- PHẦN 1: CÁC THAO TÁC ĐIỀU KHIỂN GIẢ LẬP ĐỂ KHÔNG BỊ LỖI PHẦN CỨNG --- */
    function navigateGallery(dir) {}
    function adjustPurchaseQty(val) {}
    function addProductToCart() {}

    /* --- PHẦN 2: LOGIC XỬ LÝ BÌNH LUẬN VÀ ĐÁNH GIÁ VÀ SẢN PHẨM LIÊN QUAN --- */
    function handleStarSelect(score) {
      if (!isUserLoggedIn()) {
        requireLoginForReview();
        return;
      }

      currentSelectedRating = score;
      const stars = document.querySelectorAll('#star-picker-container i');
      stars.forEach(star => {
        const starValue = parseInt(star.getAttribute('data-value'));
        if (starValue <= score) {
          star.classList.remove('fa-regular');
          star.classList.add('fa-solid', 'active');
        } else {
          star.classList.remove('fa-solid', 'active');
          star.classList.add('fa-regular');
        }
      });
    }

    async function loadCommentsUI() {
      const listTarget = document.getElementById('comment-list-target');
      try {
        const fetchComments = async (withCredentials) => fetch(`${API_BASE}/comments/product/${productId}`, {
          method: 'GET',
          credentials: withCredentials ? 'include' : 'omit',
          headers: { 'Accept': 'application/json' }
        });

        let response = await fetchComments(true);

        let comments = [];
        if (response.ok) {
          const data = await response.json();
          comments = Array.isArray(data) ? data : (data && Array.isArray(data.comments) ? data.comments : []);
        } else if (response.status === 401 || response.status === 403) {
          response = await fetchComments(false);
          if (response.ok) {
            const data = await response.json();
            comments = Array.isArray(data) ? data : (data && Array.isArray(data.comments) ? data.comments : []);
          } else if (response.status !== 401 && response.status !== 403) {
            throw new Error(`Lỗi ${response.status}`);
          }
        } else {
          throw new Error(`Lỗi ${response.status}`);
        }

        if (!comments || comments.length === 0) {
          listTarget.innerHTML = `
        <div style="padding: 30px 0; text-align: center; color: var(--text-muted); font-size: 14px;">
          <i class="fa-regular fa-comment-dots" style="font-size: 24px; display:block; margin-bottom: 10px;"></i>
          Chưa có đánh giá nào cho sản phẩm này.
        </div>`;
          return;
        }

        listTarget.innerHTML = comments.map(c => {
          let starGroupHtml = '';
          for (let i = 1; i <= 5; i++) {
            starGroupHtml += i <= Number(c.rating || 0)
              ? `<i class="fa-solid fa-star"></i>`
              : `<i class="fa-regular fa-star"></i>`;
          }

          const isOwner = isOwnComment(c);

          let actionButtonsHtml = '';
          if (isOwner) {
            actionButtonsHtml = `
          <i class="fa-solid fa-pen-to-square" onclick="toggleEditRow(${c.id})" style="color: var(--text-muted); cursor: pointer; font-size: 13px; margin-left: 15px;" title="Sửa bình luận"></i>
          <i class="fa-solid fa-trash-can" onclick="removeComment(${c.id})" style="color: var(--danger); cursor: pointer; font-size: 13px; margin-left: 10px;" title="Xóa bình luận"></i>
        `;
          }

          const safeContent = (c.content || '').toString().replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const safeName = (c.userName || c.username || c.user?.fullName || c.user?.name || 'Khách hàng ẩn danh').toString().replace(/</g, '&lt;').replace(/>/g, '&gt;');

          return `
        <div class="comment-card-item" id="comment-block-${c.id}">
          <div class="comment-user-row">
            <div>
              <span class="comment-user-name">${safeName}</span>
              ${actionButtonsHtml}
            </div>
            <div class="comment-stars-view">${starGroupHtml}</div>
          </div>
          
          <p class="comment-text-content" id="comment-text-${c.id}">${safeContent}</p>
          
          <div id="edit-form-${c.id}" style="display: none; margin-top: 10px;">
            <div class="star-rating-picker" id="edit-star-picker-${c.id}" style="margin-bottom: 8px;">
              ${[1, 2, 3, 4, 5].map(star => `
                <i class="${star <= Number(c.rating || 0) ? 'fa-solid' : 'fa-regular'} fa-star active" 
                   data-star="${star}" 
                   onclick="changeEditStar(${c.id}, ${star})"
                   style="font-size: 16px; color: ${star <= Number(c.rating || 0) ? 'var(--star-color)' : '#ddd'}"></i>
              `).join('')}
            </div>
            <textarea id="edit-input-${c.id}" style="width:100%; height:70px; padding:10px; border:1px solid var(--gray-border); border-radius:4px; font-size:14px; resize:none; outline:none; font-weight:500; margin-bottom:8px;">${safeContent}</textarea>
            <div style="display: flex; gap: 8px;">
              <button class="btn-submit-comment" onclick="saveUpdatedComment(${c.id})" style="padding: 6px 15px; font-size: 12px;">Lưu</button>
              <button class="btn-submit-comment" onclick="toggleEditRow(${c.id})" style="padding: 6px 15px; font-size: 12px; background: #6b7280; border-color: #6b7280;">Hủy</button>
            </div>
          </div>
        </div>
      `;
        }).join('');

      } catch (err) {
        console.error("Lỗi tải danh sách comment:", err);
        listTarget.innerHTML = `
        <div style="padding: 30px 0; text-align: center; color: var(--text-muted); font-size: 14px;">
          <i class="fa-regular fa-comment-dots" style="font-size: 24px; display:block; margin-bottom: 10px;"></i>
          Danh sách đánh giá hiện đang không khả dụng lúc này.
        </div>`;
      }
    }

    function requireLoginForReview() {
      const loggedIn = Boolean(localStorage.getItem('fullName') || localStorage.getItem('email') || accessToken);
      if (!loggedIn) {
        const redirectUrl = encodeURIComponent(buildCommentRedirectUrl());
        window.location.href = `login.html?redirect=${redirectUrl}`;
        return false;
      }
      return true;
    }

    async function submitProductComment() {
      const inputEl = document.getElementById('comment-input-text');
      const content = inputEl.value.trim();

      if (!requireLoginForReview()) {
        return;
      }

      if (!content) {
        Swal.fire({ icon: 'warning', title: 'Nội dung trống', text: 'Vui lòng nhập nội dung cảm nghĩ trước khi gửi đánh giá!' });
        return;
      }

      try {
        const bodyRequest = { content: content, rating: currentSelectedRating };
        await apiPost(`/comments?productId=${productId}`, bodyRequest);

        Swal.fire({ icon: 'success', title: 'Đánh giá thành công', text: 'Cảm ơn bạn đã đóng góp ý kiến phản hồi!', showConfirmButton: false, timer: 1500 });

        inputEl.value = '';
        handleStarSelect(5);
        await loadCommentsUI();

      } catch (err) {
        console.error("Lỗi đăng bình luận:", err);
        Swal.fire({ icon: 'error', title: 'Gửi đánh giá thất bại', text: 'Vui lòng đăng nhập tài khoản thành viên để thực hiện chức năng này!' });
      }
    }

    let activeEditRatings = {};

    function toggleEditRow(commentId) {
      const textEl = document.getElementById(`comment-text-${commentId}`);
      const formEl = document.getElementById(`edit-form-${commentId}`);

      if (formEl.style.display === 'none') {
        formEl.style.display = 'block';
        textEl.style.display = 'none';

        const activeStars = document.querySelectorAll(`#edit-star-picker-${commentId} i.fa-solid`);
        activeEditRatings[commentId] = activeStars.length;
      } else {
        formEl.style.display = 'none';
        textEl.style.display = 'block';
      }
    }

    function changeEditStar(commentId, score) {
      activeEditRatings[commentId] = score;
      const stars = document.querySelectorAll(`#edit-star-picker-${commentId} i`);
      stars.forEach(star => {
        const starValue = parseInt(star.getAttribute('data-star'));
        if (starValue <= score) {
          star.classList.remove('fa-regular');
          star.classList.add('fa-solid');
          star.style.color = 'var(--star-color)';
        } else {
          star.classList.remove('fa-solid');
          star.classList.add('fa-regular');
          star.style.color = '#ddd';
        }
      });
    }

    async function saveUpdatedComment(commentId) {
      if (!requireLoginForReview()) {
        return;
      }

      const newContent = document.getElementById(`edit-input-${commentId}`).value.trim();
      const newRating = activeEditRatings[commentId] || 5;

      if (!newContent) {
        Swal.fire({ icon: 'warning', title: 'Nội dung trống', text: 'Nội dung bình luận không được để trống!' });
        return;
      }

      try {
        const bodyUpdate = { content: newContent, rating: newRating };
        await apiPut(`/comments/${commentId}`, bodyUpdate);

        Swal.fire({ icon: 'success', title: 'Đã cập nhật', text: 'Thay đổi đánh giá đã được lưu thành công!', showConfirmButton: false, timer: 1500 });
        await loadCommentsUI();

      } catch (err) {
        console.error("Lỗi cập nhật comment:", err);
        Swal.fire({ icon: 'error', title: 'Thất bại', text: 'Không thể chỉnh sửa bình luận này!' });
      }
    }

    async function removeComment(commentId) {
      if (!requireLoginForReview()) {
        return;
      }

      const result = await Swal.fire({
        title: 'Xóa bình luận?',
        text: "Bạn có chắc chắn muốn gỡ bỏ đánh giá này không?",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#111111',
        cancelButtonColor: '#ef4444',
        confirmButtonText: 'ĐỒNG Ý',
        cancelButtonText: 'HỦY'
      });

      if (result.isConfirmed) {
        try {
          await apiDelete(`/comments/${commentId}`);
          Swal.fire({ icon: 'success', title: 'Đã xóa!', showConfirmButton: false, timer: 1500 });
          await loadCommentsUI();
        } catch (err) {
          console.error("Lỗi xóa comment:", err);
          Swal.fire({ icon: 'error', title: 'Thất bại', text: 'Không thể xóa bình luận này!' });
        }
      }
    }

    async function fetchRelatedProducts() {
      const target = document.getElementById('related-list-target');
      const viewMoreBtn = document.getElementById('btn-load-more-related');
      const collapseBtn = document.getElementById('btn-collapse-related');
      const spinner = document.getElementById('related-loading-spinner');

      try {
        const response = await apiGet(`/products/${productId}/related?page=${currentRelatedPage}&size=${RELATED_PAGE_SIZE}`);
        const relatedProducts = response.content || [];
        const isLastPage = response.last;

        if (spinner) spinner.remove();

        if (currentRelatedPage === 0 && relatedProducts.length === 0) {
          target.innerHTML = `
            <div style="padding: 20px 0; color: var(--text-muted); font-size: 14px; font-weight: 500; grid-column: 1/-1;">
              Không tìm thấy sản phẩm nào liên quan cùng thương hiệu.
            </div>`;
          viewMoreBtn.style.display = 'none';
          collapseBtn.style.display = 'none';
          return;
        }

        const itemsHtml = relatedProducts.map(p => {
          const images = p.images && p.images.length > 0 ? p.images : [];
          const imgSrc = images.length > 0
            ? (images[0].startsWith('http') ? images[0] : IMG_BASE + images[0])
            : 'https://via.placeholder.com/300';
          const imgFallback = images.length > 0 && !images[0].startsWith('http')
            ? IMG_BASE_FALLBACK + images[0]
            : '';

          return `
            <a href="product_detail.html?id=${p.id}" class="related-card">
              <div class="related-img-wrapper">
                <img src="${imgSrc}" alt="${p.productName}" ${imgFallback ? `onerror="this.onerror=null; this.src='${imgFallback}'"` : ''}>
              </div>
              <div class="related-name">${p.productName}</div>
              <div class="related-price">${p.price.toLocaleString('vi-VN')}đ</div>
            </a>
          `;
        }).join('');

        if (currentRelatedPage === 0) {
          target.innerHTML = itemsHtml;
        } else {
          target.insertAdjacentHTML('beforeend', itemsHtml);
        }

        if (isLastPage || relatedProducts.length < RELATED_PAGE_SIZE) {
          viewMoreBtn.style.display = 'none';
        } else {
          viewMoreBtn.style.display = 'inline-block';
        }

        if (currentRelatedPage >= 1) {
          collapseBtn.style.display = 'inline-block';
        } else {
          collapseBtn.style.display = 'none';
        }

      } catch (err) {
        console.error("Lỗi tải sản phẩm liên quan:", err);
        if (spinner) spinner.remove();
        if (currentRelatedPage === 0) {
          target.innerHTML = `
            <div style="padding: 20px 0; color: var(--danger); font-size: 14px; font-weight: 600; grid-column: 1/-1;">
              <i class="fa-solid fa-triangle-exclamation"></i> Không thể tải danh sách sản phẩm liên quan lúc này.
            </div>`;
        }
      }
    }

    async function loadNextRelatedPage() {
      currentRelatedPage += 1;
      const viewMoreBtn = document.getElementById('btn-load-more-related');
      const originalText = viewMoreBtn.innerHTML;

      viewMoreBtn.disabled = true;
      viewMoreBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang tải...`;

      await fetchRelatedProducts();

      viewMoreBtn.disabled = false;
      viewMoreBtn.innerHTML = originalText;
    }

    async function collapseRelatedToDefault() {
      currentRelatedPage = 0;
      const target = document.getElementById('related-list-target');
      const collapseBtn = document.getElementById('btn-collapse-related');
      const viewMoreBtn = document.getElementById('btn-load-more-related');

      collapseBtn.style.display = 'none';
      viewMoreBtn.style.display = 'none';
      target.innerHTML = `
        <div id="related-loading-spinner" style="padding: 30px 0; text-align: center; color: var(--text-muted); grid-column: 1/-1;">
          <i class="fa-solid fa-spinner fa-spin" style="margin-right: 8px;"></i> Đang thu gọn...
        </div>`;

      await fetchRelatedProducts();
      document.querySelector('.related-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
