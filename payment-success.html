<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kết quả thanh toán | Sportify Premium Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --white: #ffffff;
      --black: #000000;
      --gray-bg: #f8f9fa;
      --gray-border: #dee2e6;
      --text-muted: #6c757d;
      
      /* Hệ màu thực tế chỉ nhấn khi có kết quả */
      --success: #155724;
      --success-bg: #d4edda;
      --success-border: #c3e6cb;
      --danger: #721c24;
      --danger-bg: #f8d7da;
      --danger-border: #f5c6cb;
      
      --radius: 4px; /* Giảm bo góc tối đa, vuông vắn, góc cạnh */
      --transition: all 0.2s ease-in-out;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--white);
      color: var(--black);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Đổi nền nhẹ nhàng theo kết quả nhưng giữ tông sáng tối giản */
    body.is-success { background-color: #fafdfb; }
    body.is-danger { background-color: #fffbfa; }

    /* ===== HEADER ĐEN TRẮNG ĐỒNG BỘ ===== */
    .header {
      background: var(--white);
      border-bottom: 2px solid var(--black); 
      padding: 20px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .logo-text { font-size: 22px; font-weight: 900; letter-spacing: 0px; color: var(--black); text-transform: uppercase; }

    /* ===== CONTAINER ===== */
    .result-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
    }

    /* --- Trạng thái đang xác thực --- */
    .loading-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }

    .loading-card p {
      font-weight: 600;
      color: var(--black);
      font-size: 14px;
    }

    .loading-dots span {
      display: inline-block;
      animation: blink 1.4s infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

    /* --- Thẻ kết quả kiểu khối vuông vắn --- */
    .result-card {
      background: var(--white);
      border: 1px solid var(--black);
      border-radius: var(--radius);
      padding: 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      transition: var(--transition);
    }

    .result-card:hover {
      box-shadow: 6px 6px 0px var(--black);
    }

    .status-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    /* Đổ màu chuẩn thực tế cho box icon trạng thái */
    .status-icon.success { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
    .status-icon.danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }

    .result-title {
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }

    .result-message {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .ticket-divider {
      border: none;
      border-top: 1px dashed var(--gray-border);
      margin: 0 0 24px 0;
    }

    .info-list {
      text-align: left;
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .info-row .label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .info-row .value {
      color: var(--black);
      font-weight: 600;
      text-align: right;
    }

    .info-row.amount .value {
      font-size: 18px;
      font-weight: 800;
    }

    /* ===== BUTTONS ĐEN KHỐI ===== */
    .action-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--black);
      color: var(--white);
      font-weight: 700;
      border-radius: var(--radius);
      text-transform: uppercase;
      font-size: 13px;
      border: 1px solid var(--black);
      transition: var(--transition);
      cursor: pointer;
      margin-bottom: 12px;
    }

    .action-btn:hover {
      background: #212529;
    }

    .secondary-link {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-decoration: none;
      transition: var(--transition);
    }

    .secondary-link:hover { 
      color: var(--black); 
      text-decoration: underline; 
    }

    .trust-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--gray-bg);
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .trust-note i { color: var(--black); }
  </style>
</head>

<body>

  <header class="header">
    <div class="header-inner">
      <a href="products.html" class="logo">
        <span class="logo-text">SPORTIFY</span>
      </a>
    </div>
  </header>

  <main class="result-container">
    <div class="loading-card" id="loading-card">
      <i class="fa-solid fa-spinner fa-spin" style="font-size: 28px; color: var(--black);"></i>
      <p>Đang xác thực bảo mật từ cổng VNPAY<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></p>
    </div>

    <div class="result-card" id="result-card" style="display: none;">
      <div id="status-icon" class="status-icon"></div>
      <h2 id="status-title" class="result-title"></h2>
      <p id="status-message" class="result-message"></p>

      <hr class="ticket-divider">

      <div class="info-list">
        <div class="info-row">
          <span class="label">Mã đơn hàng</span>
          <span class="value" id="res-order-id">N/A</span>
        </div>
        <div class="info-row amount">
          <span class="label">Số tiền đã trả</span>
          <span class="value" id="res-amount">0đ</span>
        </div>
        <div class="info-row">
          <span class="label">Nội dung thanh toán</span>
          <span class="value" id="res-info">N/A</span>
        </div>
      </div>

      <a href="products.html" id="next-action-btn" class="action-btn">Quay lại cửa hàng</a>
      <a href="products.html" class="secondary-link">Về trang chủ Sportify</a>

      <div class="trust-note">
        <i class="fa-solid fa-shield-halved"></i>
        <span>Giao dịch được bảo mật bởi VNPAY Gateway</span>
      </div>
    </div>
  </main>

  <script src="api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      // 1. Đọc dữ liệu từ URL hiển thị lên bill
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get('vnp_TxnRef');
      const amount = urlParams.get('vnp_Amount');
      const orderInfo = urlParams.get('vnp_OrderInfo');

      document.getElementById('res-order-id').innerText = "#" + (orderId || "");
      document.getElementById('res-amount').innerText = amount ? (parseInt(amount) / 100).toLocaleString('vi-VN') + 'đ' : '0đ';
      document.getElementById('res-info').innerText = decodeURIComponent(orderInfo || "").replace(/\+/g, ' ');

      const iconDiv = document.getElementById('status-icon');
      const titleH2 = document.getElementById('status-title');
      const messageP = document.getElementById('status-message');
      const nextBtn = document.getElementById('next-action-btn');

      // 2. Gửi dữ liệu Callback sang Backend
      let backendResult = null;
      try {
        backendResult = await apiGet(`/order/vnpay-callback${window.location.search}`);
      } catch (err) {
        console.error("Lỗi kết nối đồng bộ callback sang Backend:", err);
      }

      // 3. Ẩn loading, hiện giao diện hoá đơn
      document.getElementById('loading-card').style.display = 'none';
      document.getElementById('result-card').style.display = 'block';

      // 4. Kiểm tra trạng thái và nạp class màu tương ứng
      if (backendResult && backendResult.status === "SUCCESS") {
        document.body.classList.add('is-success');
        iconDiv.className = "status-icon success";
        iconDiv.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
        titleH2.innerText = "Thanh toán thành công";
        messageP.innerText = "Đơn hàng của bạn đã được đối soát an toàn trên hệ thống Sportify và đang chờ chuẩn bị giao hàng.";
        nextBtn.innerText = "Xem đơn hàng của tôi";
        nextBtn.href = "orders.html"; 
        
        if (typeof clearCart === "function") { clearCart(); }
      } else {
        document.body.classList.add('is-danger');
        iconDiv.className = "status-icon danger";
        iconDiv.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
        titleH2.innerText = backendResult ? backendResult.message : "Thanh toán thất bại";
        messageP.innerText = "Giao dịch không thành công, sai chữ ký bảo mật hoặc đã bị hủy bỏ bởi người dùng.";
        nextBtn.innerText = "Quay về giỏ hàng";
        nextBtn.href = "cart.html"; 
      }
    });
  </script>
</body>

</html>
